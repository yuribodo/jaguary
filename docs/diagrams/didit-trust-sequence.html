</style></head><body><main class="page"><p class="eyebrow">DIDIT INTEGRATION · TRUST SEQUENCE</p><h1>External evidence, local enforcement</h1><p class="intro">Didit hosts operator verification and sends authenticated evidence. Bound stores a normalized snapshot; later Verify reads PostgreSQL and makes no provider call.</p><div class="diagram"><svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="didit-title didit-desc">
<title id="didit-title">Didit operator attestation and Bound verification sequence</title><desc id="didit-desc">The browser consents through the Trust API, which creates a Didit hosted session and stores pending state. Didit later sends a signed webhook. Bound validates, normalizes, and persists the event. During a purchase, Bound Verify reads the current trust snapshot from PostgreSQL without calling Didit.</desc><defs><marker id="didit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#334de8"/></marker><marker id="didit-return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#5e6158"/></marker><marker id="didit-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polyline points="0 0,8 4,0 8" fill="none" stroke="#5e6158" stroke-width="2"/></marker></defs><rect width="1280" height="720" fill="#f4f0e7"/>

<line class="call" x1="388" y1="204" x2="632" y2="204" marker-end="url(#didit-arrow)"/><rect x="456" y="180" width="104" height="12" rx="4" fill="#f4f0e7"/><text class="msg" x="508" y="188" text-anchor="middle">POST /SESSION</text>
<line class="return" x1="632" y1="244" x2="388" y2="244" marker-end="url(#didit-return)"/><rect x="456" y="220" width="104" height="12" rx="4" fill="#f4f0e7"/><text class="msg" x="508" y="228" text-anchor="middle">HOSTED URL</text>
