<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jaguary system context</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f4f0e7;--paper2:#faf8f2;--ink:#141511;--muted:#5e6158;--soft:#777b82;--rule:rgba(20,21,17,.16);--accent:#334de8;--accent-tint:rgba(51,77,232,.08);--link:#334de8}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Geist,sans-serif}.page{max-width:1360px;margin:0 auto;padding:40px}.eyebrow{margin:0 0 8px;color:var(--muted);font:500 8px/1 Geist Mono,monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font:400 40px/1.04 Instrument Serif,serif}.intro{max-width:820px;margin:12px 0 28px;color:var(--muted);font-size:16px;line-height:1.5}.diagram{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--paper2)}svg{display:block;min-width:960px;width:100%;height:auto}.zone{fill:rgba(20,21,17,.02);stroke:rgba(20,21,17,.14);stroke-width:1}.node{fill:var(--paper);stroke:var(--ink);stroke-width:1}.external{fill:rgba(20,21,17,.03);stroke:rgba(20,21,17,.3);stroke-width:1}.store{fill:rgba(20,21,17,.05);stroke:var(--muted);stroke-width:1}.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}.boundary{fill:var(--paper)}.tag{fill:var(--muted);font:500 8px Geist Mono,monospace;letter-spacing:.14em}.name{fill:var(--ink);font:600 12px Geist,sans-serif}.sub{fill:var(--muted);font:400 8px Geist Mono,monospace}.edge{fill:none;stroke:var(--muted);stroke-width:2}.edge-link{fill:none;stroke:var(--link);stroke-width:2}.edge-approved{fill:none;stroke:var(--accent);stroke-width:2}.edge-blocked{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 8}.edge-label{fill:var(--muted);font:500 8px Geist Mono,monospace;letter-spacing:.08em}.legend{fill:var(--muted);font:400 8px Geist Mono,monospace;letter-spacing:.08em}.stop{fill:var(--paper);stroke:var(--ink);stroke-width:2}
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">CURRENT IMPLEMENTATION · SYSTEM CONTEXT</p>
  <h1>The supported road from conversation to payment</h1>
  <p class="intro">External systems contribute language, commerce, or evidence. Bound remains the privileged gate: only a transactionally reserved authorization can reach payment.</p>
  <div class="diagram">
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ctx-title ctx-desc">
      <title id="ctx-title">Jaguary and Bound system context</title>
      <desc id="ctx-desc">Three trust zones show clients and providers, the private Bound API, and durable PostgreSQL state. The approved path moves from TravelBot through Bound Verify to Payment Service. Direct payment attempts from the browser or OpenAI stop at the Bound boundary.</desc>
      <defs>
        <marker id="ctx-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#5e6158"/></marker>
        <marker id="ctx-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#334de8"/></marker>
        <marker id="ctx-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#334de8"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f4f0e7"/>
      <rect class="zone" x="40" y="64" width="280" height="536" rx="8"/>
      <rect class="zone" x="360" y="64" width="560" height="536" rx="8"/>
      <rect class="zone" x="960" y="64" width="280" height="536" rx="8"/>
      <rect class="boundary" x="56" y="68" width="152" height="16" rx="4"/><text class="tag" x="64" y="80">CLIENTS + PROVIDERS</text>
      <rect class="boundary" x="376" y="68" width="112" height="16" rx="4"/><text class="tag" x="384" y="80">BOUND API · PRIVATE</text>
      <rect class="boundary" x="976" y="68" width="112" height="16" rx="4"/><text class="tag" x="984" y="80">DURABLE STATE</text>

      <!-- approved and integration paths: drawn before nodes -->
      <path class="edge-link" d="M280 156 H392" marker-end="url(#ctx-arrow-link)"/>
      <rect x="312" y="132" width="48" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="336" y="140" text-anchor="middle">API ONLY</text>

      <path class="edge-link" d="M480 184 V212 Q480 220 472 220 H288 Q280 220 280 228 V276" marker-end="url(#ctx-arrow-link)"/>
      <rect x="352" y="196" width="72" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="388" y="204" text-anchor="middle">RESPONSES</text>

      <path class="edge-link" d="M280 396 H312 Q320 396 320 388 V292 Q320 284 328 284 H392" marker-end="url(#ctx-arrow-link)"/>
      <rect x="284" y="332" width="72" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="320" y="340" text-anchor="middle">WEBHOOK</text>

      <path class="edge-link" d="M392 168 H344 Q336 168 336 176 V388 a8 8 0 0 0 0 16 V508 Q336 516 328 516 H280" marker-end="url(#ctx-arrow-link)"/>
      <rect x="304" y="468" width="64" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="336" y="476" text-anchor="middle">CHECKOUT</text>

      <path class="edge-approved" d="M480 184 V356" marker-end="url(#ctx-arrow-accent)"/>
      <rect x="492" y="260" width="56" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="520" y="268">VERIFY</text>

      <path class="edge-approved" d="M520 424 V516" marker-end="url(#ctx-arrow-accent)"/>
      <rect x="532" y="460" width="56" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="560" y="468">RESERVED</text>

      <path class="edge" d="M608 284 H980" marker-end="url(#ctx-arrow)"/>
      <rect x="760" y="260" width="64" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="792" y="268" text-anchor="middle">TRUST STATE</text>

      <path class="edge" d="M648 396 H980" marker-end="url(#ctx-arrow)"/>
      <rect x="772" y="372" width="64" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="804" y="380" text-anchor="middle">RESERVE</text>

      <path class="edge" d="M648 548 H784 Q792 548 792 540 V492 Q792 484 800 484 H980" marker-end="url(#ctx-arrow)"/>
      <rect x="816" y="460" width="56" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="844" y="468" text-anchor="middle">RECEIPT</text>

      <!-- forbidden ingress terminates at boundary -->
      <path class="edge-blocked" d="M280 316 H340"/>
      <circle class="stop" cx="348" cy="316" r="8"/><line x1="344" y1="312" x2="352" y2="320" stroke="#141511" stroke-width="2"/><line x1="352" y1="312" x2="344" y2="320" stroke="#141511" stroke-width="2"/>
      <rect x="284" y="292" width="56" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="312" y="300" text-anchor="middle">NO PAY</text>

      <path class="edge-blocked" d="M280 124 H340"/>
      <circle class="stop" cx="348" cy="124" r="8"/><line x1="344" y1="120" x2="352" y2="128" stroke="#141511" stroke-width="2"/><line x1="352" y1="120" x2="344" y2="128" stroke="#141511" stroke-width="2"/>
      <rect x="280" y="100" width="64" height="12" rx="4" fill="#f4f0e7"/><text class="edge-label" x="312" y="108" text-anchor="middle">NO BYPASS</text>

      <!-- nodes -->
      <rect class="external" x="80" y="124" width="200" height="64" rx="8"/><text class="tag" x="92" y="140">USER</text><text class="name" x="180" y="160" text-anchor="middle">Trusted Surface</text><text class="sub" x="180" y="176" text-anchor="middle">Next.js browser</text>
      <rect class="external" x="80" y="276" width="200" height="64" rx="8"/><text class="tag" x="92" y="292">LLM</text><text class="name" x="180" y="312" text-anchor="middle">OpenAI</text><text class="sub" x="180" y="328" text-anchor="middle">language + tool proposals</text>
      <rect class="external" x="80" y="364" width="200" height="64" rx="8"/><text class="tag" x="92" y="380">KYA</text><text class="name" x="180" y="400" text-anchor="middle">Didit</text><text class="sub" x="180" y="416" text-anchor="middle">operator evidence</text>
      <rect class="external" x="80" y="484" width="200" height="64" rx="8"/><text class="tag" x="92" y="500">MERCHANT</text><text class="name" x="180" y="520" text-anchor="middle">VuelaYa</text><text class="sub" x="180" y="536" text-anchor="middle">offers · UCP checkout</text>

      <rect class="node" x="392" y="124" width="216" height="60" rx="8"/><text class="tag" x="404" y="140">ISOLATED RUNTIME</text><text class="name" x="500" y="160" text-anchor="middle">TravelBot</text><text class="sub" x="500" y="176" text-anchor="middle">intent + orchestration</text>
      <rect class="node" x="392" y="252" width="216" height="64" rx="8"/><text class="tag" x="404" y="268">TRUST</text><text class="name" x="500" y="288" text-anchor="middle">Trust Service</text><text class="sub" x="500" y="304" text-anchor="middle">normalize · passport</text>
      <rect class="focal" x="392" y="356" width="256" height="68" rx="8"/><text class="tag" x="404" y="372">PRIVILEGED GATE</text><text class="name" x="520" y="396" text-anchor="middle">Bound Verify</text><text class="sub" x="520" y="412" text-anchor="middle">deterministic policy + reservation</text>
      <rect class="node" x="392" y="516" width="256" height="64" rx="8"/><text class="tag" x="404" y="532">EFFECT</text><text class="name" x="520" y="552" text-anchor="middle">Payment Service</text><text class="sub" x="520" y="568" text-anchor="middle">persisted authorization only</text>

      <rect class="store" x="980" y="236" width="224" height="280" rx="8"/><text class="tag" x="996" y="256">SOURCE OF TRUTH</text><text class="name" x="1092" y="292" text-anchor="middle">PostgreSQL</text><text class="sub" x="1092" y="312" text-anchor="middle">identity · trust · mandates</text><text class="sub" x="1092" y="332" text-anchor="middle">nonces · authorizations</text><line x1="1004" y1="356" x2="1180" y2="356" stroke="rgba(20,21,17,.16)"/><text class="name" x="1092" y="392" text-anchor="middle">Ledger + Receipts</text><text class="sub" x="1092" y="412" text-anchor="middle">correlated hash chain</text><text class="sub" x="1092" y="432" text-anchor="middle">audit destination</text>

      <!-- legend -->
      <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(20,21,17,.16)"/>
      <text class="tag" x="40" y="660">LEGEND</text>
      <line class="edge-approved" x1="144" y1="656" x2="192" y2="656" marker-end="url(#ctx-arrow-accent)"/><text class="legend" x="204" y="660">approved economic path</text>
      <line class="edge-link" x1="392" y1="656" x2="440" y2="656" marker-end="url(#ctx-arrow-link)"/><text class="legend" x="452" y="660">external API / protocol</text>
      <line class="edge-blocked" x1="640" y1="656" x2="688" y2="656"/><text class="legend" x="700" y="660">forbidden ingress</text>
      <rect class="store" x="864" y="648" width="24" height="16" rx="4"/><text class="legend" x="900" y="660">durable state and audit</text>
    </svg>
  </div>
</main>
</body>
</html>
