</style></head><body><main class="page"><p class="eyebrow">FLIGHT DISCOVERY · PROVIDER SEQUENCE</p><h1>Search becomes an offer, not authority</h1><p class="intro">SerpApi retrieves Google Flights-shaped results. VuelaYa validates and normalizes them before the merchant authors a separate signed checkout.</p><div class="diagram"><svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gfs-title gfs-desc">

<line class="call" x1="388" y1="204" x2="632" y2="204" marker-end="url(#gfs-arrow)"/><rect x="460" y="180" width="96" height="12" rx="4" fill="#f4f0e7"/><text class="msg" x="508" y="188" text-anchor="middle">HTTPS SEARCH</text>
