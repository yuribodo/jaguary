</style></head><body><main class="page"><p class="eyebrow">OPENAI INTEGRATION · REQUEST SEQUENCE</p><h1>One durable TravelBot turn</h1><p class="intro">The model interprets and proposes. Persisted state and application code decide which tools are legal and commit the turn exactly once.</p><div class="diagram"><svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oai-title oai-desc">

<line class="call" x1="388" y1="204" x2="632" y2="204" marker-end="url(#oai-arrow)"/><rect x="464" y="180" width="88" height="12" rx="4" fill="#f4f0e7"/><text class="msg" x="508" y="188" text-anchor="middle">CLAIM TURN</text>
