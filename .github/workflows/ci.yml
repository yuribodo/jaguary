name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: bound_test
          POSTGRES_USER: bound_test
          POSTGRES_PASSWORD: bound_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bound_test -d bound_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bound_test:bound_test_ci@localhost:5432/bound_test
      TEST_DATABASE_URL: postgresql://bound_test:bound_test_ci@localhost:5432/bound_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
